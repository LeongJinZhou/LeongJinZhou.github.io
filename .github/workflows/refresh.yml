name: refresh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/refresh.ts generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: generated
          if-no-files-found: error
          include-hidden-files: false

  commit:
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: ${{ runner.temp }}/generated
      - name: Commit to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GENERATED: ${{ runner.temp }}/generated
        run: |
          set -euo pipefail
          # Token stays in this process env only, never in .git/config or the remote URL.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          git init -q work
          cd work
          git remote add origin "$REPO_URL"
          if git -c http.extraheader="$AUTH" ls-remote --exit-code --heads origin data >/dev/null; then
            git -c http.extraheader="$AUTH" fetch -q --depth=1 origin data
            git checkout -q -b data FETCH_HEAD
          else
            git checkout -q --orphan data
          fi
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          # -print -quit: no pipe, so pipefail cannot turn a SIGPIPE into a pass.
          if [ -n "$(find "$GENERATED" \( -type l -o -name '.*' \) ! -path "$GENERATED" -print -quit)" ]; then
            echo "::error::Artifact contains a symlink or hidden file."
            exit 1
          fi
          if [ -d "$GENERATED/shots" ] && [ -n "$(find "$GENERATED/shots" ! -path "$GENERATED/shots" ! \( -type f \( -name '*.webp' -o -name '*.png' \) \) -print -quit)" ]; then
            echo "::error::shots/ may only contain .webp and .png files."
            exit 1
          fi
          cp "$GENERATED/projects.json" .
          if [ -d "$GENERATED/shots" ]; then cp -R "$GENERATED/shots" .; fi
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: daily refresh"
          git -c http.extraheader="$AUTH" push -q origin data

  deploy:
    needs: commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  verdict:
    if: always()
    needs: [generate, commit, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::A refresh job ended as $r."; exit 1; }
          done
