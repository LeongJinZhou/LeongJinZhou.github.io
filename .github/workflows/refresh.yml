name: refresh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      manifest_sha: ${{ steps.manifest.outputs.manifest_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/refresh.ts generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Fingerprint of everything the commit and profile jobs will trust. The hash travels as a job output, which no later job can alter.
      - id: manifest
        working-directory: generated
        run: |
          set -euo pipefail
          find projects.json profile -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > MANIFEST.sha256
          echo "manifest_sha=$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: generated
          if-no-files-found: error
          include-hidden-files: false

  # Untrusted pages are opened here: read-only token, no secrets in any env. A failure keeps old images and sets failed=true (rule 9).
  screenshots:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.shots.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Previous images; the data branch may not exist yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: data
          path: previous
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: generated
      # ubuntu-latest AppArmor blocks Chromium's user-namespace sandbox otherwise; we keep the sandbox ON.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: shots
        run: node scripts/screenshots.ts generated previous/shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final
          path: generated
          if-no-files-found: error
          include-hidden-files: false

  # Third-party action in its own read-only job, no secrets, no other job's data (rule 12). Output goes on as an artifact.
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: LeongJinZhou
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake
          path: dist
          if-no-files-found: error
          include-hidden-files: false

  commit:
    needs: [generate, screenshots]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # projects.json comes only from the trusted generate job; only shots/ comes from the screenshots job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: ${{ runner.temp }}/generated
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: final
          path: ${{ runner.temp }}/final
      - name: Commit to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GENERATED: ${{ runner.temp }}/generated
          FINAL: ${{ runner.temp }}/final
          MANIFEST_SHA: ${{ needs.generate.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          # Token stays in the env of git network commands only: not in argv, .git/config or the remote URL.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          gitnet() { GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$AUTH" git "$@"; }
          # `generated` must be exactly what the generate job wrote: its manifest hash arrives through the job graph.
          verify_generated() {
            cd "$GENERATED"
            if [ ! -f MANIFEST.sha256 ] || [ "$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" != "$MANIFEST_SHA" ] || ! sha256sum -c --quiet MANIFEST.sha256 >/dev/null 2>&1; then
              echo "::error::Generated artifact does not match the generate job manifest."
              exit 1
            fi
            while IFS= read -r -d '' f; do
              h="$(sha256sum "$f" | cut -d' ' -f1)" # sha256sum marks binary mode with " *" on some platforms
              if ! grep -qxF -e "$h  ${f#./}" -e "$h *${f#./}" MANIFEST.sha256; then
                echo "::error::Generated artifact has a file the manifest does not list: ${f#./}"
                exit 1
              fi
            done < <(find . -type f ! -path ./MANIFEST.sha256 -print0)
          }
          git init -q work
          cd work
          git remote add origin "$REPO_URL"
          if gitnet ls-remote --exit-code --heads origin data >/dev/null; then
            gitnet fetch -q --depth=1 origin data
            git checkout -q -b data FETCH_HEAD
          else
            git checkout -q --orphan data
          fi
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          # -print -quit: no pipe, so pipefail cannot turn a SIGPIPE into a pass.
          if [ -n "$(find "$GENERATED" "$FINAL" \( -type l -o -name '.*' \) ! -path "$GENERATED" ! -path "$FINAL" -print -quit)" ]; then
            echo "::error::Artifact contains a symlink or hidden file."
            exit 1
          fi
          (verify_generated)
          if [ -d "$FINAL/shots" ]; then
            if [ -n "$(find "$FINAL/shots" ! -path "$FINAL/shots" ! \( -type f \( -name '*.webp' -o -name '*.png' \) \) -print -quit)" ]; then
              echo "::error::shots/ may only contain .webp and .png files."
              exit 1
            fi
            # Files from the screenshots job are untrusted: check real signature and size, not the name.
            for f in "$FINAL"/shots/*; do
              [ -e "$f" ] || continue
              if [ "$(wc -c < "$f")" -gt 2097152 ]; then
                echo "::error::${f##*/} is over 2 MB."
                exit 1
              fi
              sig="$(head -c 12 "$f" | od -An -tx1 | tr -d ' \n')"
              case "$sig" in
                52494646????????57454250 | 89504e470d0a1a0a*) ;;
                *) echo "::error::${f##*/} is not a valid WebP or PNG image."; exit 1 ;;
              esac
            done
          fi
          cp "$GENERATED/projects.json" .
          if [ -d "$FINAL/shots" ]; then cp -R "$FINAL/shots" .; fi
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: daily refresh"
          gitnet push -q origin data

  # The only job that holds the profile PAT (SECURITY-RESEARCH "PAT"): no checkout, no npm, no browser, no third-party action.
  # README and SVGs come from the trusted generate job; shots from the screenshots job; snake from the snake job. All are re-checked here.
  profile:
    needs: [generate, screenshots, snake]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: ${{ runner.temp }}/generated
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: final
          path: ${{ runner.temp }}/final
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake
          path: ${{ runner.temp }}/snake
      - name: Push to profile repo
        env:
          PROFILE_REPO_TOKEN: ${{ secrets.PROFILE_REPO_TOKEN }}
          PROFILE_REPO_URL: https://github.com/LeongJinZhou/LeongJinZhou.git
          GENERATED: ${{ runner.temp }}/generated
          FINAL: ${{ runner.temp }}/final
          SNAKE: ${{ runner.temp }}/snake
          MANIFEST_SHA: ${{ needs.generate.outputs.manifest_sha }}
        run: |
          set -euo pipefail
          if [ -z "$PROFILE_REPO_TOKEN" ]; then
            echo "::warning::PROFILE_REPO_TOKEN is not set; the profile README was not pushed."
            exit 0
          fi
          # `generated` must be exactly what the generate job wrote: its manifest hash arrives through the job graph.
          verify_generated() {
            cd "$GENERATED"
            if [ ! -f MANIFEST.sha256 ] || [ "$(sha256sum MANIFEST.sha256 | cut -d' ' -f1)" != "$MANIFEST_SHA" ] || ! sha256sum -c --quiet MANIFEST.sha256 >/dev/null 2>&1; then
              echo "::error::Generated artifact does not match the generate job manifest."
              exit 1
            fi
            while IFS= read -r -d '' f; do
              h="$(sha256sum "$f" | cut -d' ' -f1)" # sha256sum marks binary mode with " *" on some platforms
              if ! grep -qxF -e "$h  ${f#./}" -e "$h *${f#./}" MANIFEST.sha256; then
                echo "::error::Generated artifact has a file the manifest does not list: ${f#./}"
                exit 1
              fi
            done < <(find . -type f ! -path ./MANIFEST.sha256 -print0)
          }
          gitnet() { GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader GIT_CONFIG_VALUE_0="$AUTH" git "$@"; }
          P="$GENERATED/profile"
          # -print -quit: no pipe, so pipefail cannot turn a SIGPIPE into a pass.
          for d in "$P" "$FINAL/shots" "$SNAKE"; do
            [ -d "$d" ] || continue
            if [ -n "$(find "$d" \( -type l -o -name '.*' \) ! -path "$d" -print -quit)" ]; then
              echo "::error::Artifact contains a symlink or hidden file."
              exit 1
            fi
          done
          # Every file is checked by content and size, never by name alone.
          check_svg() {
            if [ ! -f "$1" ]; then echo "::error::${1##*/} is missing."; exit 1; fi
            if [ "$(wc -c < "$1")" -gt 2097152 ]; then echo "::error::${1##*/} is over 2 MB."; exit 1; fi
            case "$(head -c 4096 "$1" | tr -d '\0')" in
              *'<svg'*) ;;
              *) echo "::error::${1##*/} is not an SVG."; exit 1 ;;
            esac
            # Allowlist: no links, imports, entities or declarations, and only drawing elements (snk v3.5.0 output uses svg, desc, style, rect).
            if grep -aqiE 'href|url\(|@import|&#|<!|<script|javascript:|[[:space:]]on[a-z]+=' "$1"; then
              echo "::error::${1##*/} contains active content."
              exit 1
            fi
            for e in $(grep -aoE '</?[A-Za-z][A-Za-z0-9:.-]*' "$1" | tr -d '</' | tr 'A-Z' 'a-z' | sort -u); do
              case "$e" in
                svg | g | rect | path | circle | line | polyline | polygon | text | tspan | style | title | desc | defs | lineargradient | radialgradient | stop | animate | clippath | mask) ;;
                *) echo "::error::${1##*/} contains active content (element $e)."; exit 1 ;;
              esac
            done
          }
          (verify_generated)
          if [ ! -f "$P/README.md" ]; then echo "::error::README.md is missing."; exit 1; fi
          if [ "$(wc -c < "$P/README.md")" -gt 2097152 ]; then echo "::error::README.md is over 2 MB."; exit 1; fi
          for f in banner stats-dark stats-light langs-dark langs-light; do check_svg "$P/assets/$f.svg"; done
          for f in snake-dark snake-light; do check_svg "$SNAKE/$f.svg"; done
          if [ -d "$FINAL/shots" ]; then
            if [ -n "$(find "$FINAL/shots" ! -path "$FINAL/shots" ! \( -type f \( -name '*.webp' -o -name '*.png' \) \) -print -quit)" ]; then
              echo "::error::shots/ may only contain .webp and .png files."
              exit 1
            fi
            for f in "$FINAL"/shots/*; do
              [ -e "$f" ] || continue
              if [ "$(wc -c < "$f")" -gt 2097152 ]; then
                echo "::error::${f##*/} is over 2 MB."
                exit 1
              fi
              sig="$(head -c 12 "$f" | od -An -tx1 | tr -d ' \n')"
              case "$sig" in
                52494646????????57454250 | 89504e470d0a1a0a*) ;;
                *) echo "::error::${f##*/} is not a valid WebP or PNG image."; exit 1 ;;
              esac
            done
          fi
          # Token stays in this process env only, never in .git/config or the remote URL.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PROFILE_REPO_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          git init -q work
          cd work
          git remote add origin "$PROFILE_REPO_URL"
          rc=0
          gitnet ls-remote --exit-code --heads origin main >/dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            gitnet fetch -q --depth=1 origin main
            git checkout -q -b main FETCH_HEAD
          elif [ "$rc" = 2 ]; then
            git checkout -q --orphan main
          else
            echo "::error::Could not read the profile repo."
            exit 1
          fi
          # Only the generated paths are replaced; other files in the profile repo stay.
          rm -rf README.md assets
          mkdir -p assets/shots
          cp "$P/README.md" README.md
          for f in banner stats-dark stats-light langs-dark langs-light; do cp "$P/assets/$f.svg" assets/; done
          for f in snake-dark snake-light; do cp "$SNAKE/$f.svg" assets/; done
          if [ -d "$FINAL/shots" ]; then cp -R "$FINAL/shots/." assets/shots/; fi
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: daily refresh"
          gitnet push -q origin main

  deploy:
    needs: commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  verdict:
    if: always()
    needs: [generate, screenshots, snake, commit, profile, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SHOTS_FAILED: ${{ needs.screenshots.outputs.failed }}
        run: |
          echo "Job results: $RESULTS"
          [ "$SHOTS_FAILED" != true ] || { echo "::error::A screenshot failed; old image or card was used."; exit 1; }
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::A refresh job ended as $r."; exit 1; }
          done
