name: refresh

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/refresh.ts generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: generated
          if-no-files-found: error
          include-hidden-files: false

  # Untrusted pages are opened here: read-only token, no secrets in any env. A failure keeps old images and sets failed=true (rule 9).
  screenshots:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      failed: ${{ steps.shots.outputs.failed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Previous images; the data branch may not exist yet.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: data
          path: previous
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: generated
      # ubuntu-latest AppArmor blocks Chromium's user-namespace sandbox otherwise; we keep the sandbox ON.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - id: shots
        run: node scripts/screenshots.ts generated previous/shots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final
          path: generated
          if-no-files-found: error
          include-hidden-files: false

  commit:
    needs: [generate, screenshots]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # projects.json comes only from the trusted generate job; only shots/ comes from the screenshots job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated
          path: ${{ runner.temp }}/generated
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: final
          path: ${{ runner.temp }}/final
      - name: Commit to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          GENERATED: ${{ runner.temp }}/generated
          FINAL: ${{ runner.temp }}/final
        run: |
          set -euo pipefail
          # Token stays in this process env only, never in .git/config or the remote URL.
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${AUTH#AUTHORIZATION: basic }"
          git init -q work
          cd work
          git remote add origin "$REPO_URL"
          if git -c http.extraheader="$AUTH" ls-remote --exit-code --heads origin data >/dev/null; then
            git -c http.extraheader="$AUTH" fetch -q --depth=1 origin data
            git checkout -q -b data FETCH_HEAD
          else
            git checkout -q --orphan data
          fi
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          # -print -quit: no pipe, so pipefail cannot turn a SIGPIPE into a pass.
          if [ -n "$(find "$GENERATED" "$FINAL" \( -type l -o -name '.*' \) ! -path "$GENERATED" ! -path "$FINAL" -print -quit)" ]; then
            echo "::error::Artifact contains a symlink or hidden file."
            exit 1
          fi
          if [ -d "$FINAL/shots" ]; then
            if [ -n "$(find "$FINAL/shots" ! -path "$FINAL/shots" ! \( -type f \( -name '*.webp' -o -name '*.png' \) \) -print -quit)" ]; then
              echo "::error::shots/ may only contain .webp and .png files."
              exit 1
            fi
            # Files from the screenshots job are untrusted: check real signature and size, not the name.
            for f in "$FINAL"/shots/*; do
              [ -e "$f" ] || continue
              if [ "$(wc -c < "$f")" -gt 2097152 ]; then
                echo "::error::${f##*/} is over 2 MB."
                exit 1
              fi
              sig="$(head -c 12 "$f" | od -An -tx1 | tr -d ' \n')"
              case "$sig" in
                52494646????????57454250 | 89504e470d0a1a0a*) ;;
                *) echo "::error::${f##*/} is not a valid WebP or PNG image."; exit 1 ;;
              esac
            done
          fi
          cp "$GENERATED/projects.json" .
          if [ -d "$FINAL/shots" ]; then cp -R "$FINAL/shots" .; fi
          git add -A
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes; nothing to commit."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "chore: daily refresh"
          git -c http.extraheader="$AUTH" push -q origin data

  deploy:
    needs: commit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  verdict:
    if: always()
    needs: [generate, screenshots, commit, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          SHOTS_FAILED: ${{ needs.screenshots.outputs.failed }}
        run: |
          echo "Job results: $RESULTS"
          [ "$SHOTS_FAILED" != true ] || { echo "::error::A screenshot failed; old image or card was used."; exit 1; }
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::A refresh job ended as $r."; exit 1; }
          done
